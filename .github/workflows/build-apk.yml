name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build lightweight APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 QPR2 SDK
        shell: bash
        run: |
          set -euo pipefail
          (yes || true) | sdkmanager --licenses
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Create isolated debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests and assemble APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleLite

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "Debug APK size: $(stat -c%s "$apk") bytes"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n '1,5p'
          lite="app/build/outputs/apk/lite/app-lite.apk"
          test -s "$lite"
          echo "Minified lite benchmark size: $(stat -c%s "$lite") bytes"
          sha256sum "$lite"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$lite" | sed -n '1,5p'

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: jametulhoda-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload minified lite benchmark APK
        uses: actions/upload-artifact@v7
        with:
          name: jametulhoda-lite-benchmark-apk
          path: app/build/outputs/apk/lite/app-lite.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics when build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jametulhoda-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
