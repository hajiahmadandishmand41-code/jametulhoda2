name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build full + lite APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 QPR2 SDK
        shell: bash
        run: |
          set -euo pipefail
          (yes || true) | sdkmanager --licenses
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36.1/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Create isolated debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle configuration check
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon help > /tmp/gradle-help.log 2>&1; then
            echo "::error::Gradle configuration failed"
            grep -E "error|e: |FAILURE|What went wrong|Could not|Unresolved" /tmp/gradle-help.log | head -8 | sed 's/^/::error::/' || true
            tail -30 /tmp/gradle-help.log | sed 's/^/::warning::/'
            exit 1
          fi
          echo "Gradle configuration OK"

      - name: Run unit tests (full + lite)
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon --stacktrace :app:testFullReleaseUnitTest :app:testLiteReleaseUnitTest > /tmp/gradle-test.log 2>&1; then
            echo "::error::Gradle unit tests failed"
            grep -E "error|e: |FAILED|FAILURE|What went wrong|Could not|Unresolved|Test.*failed" /tmp/gradle-test.log | head -8 | sed 's/^/::error::/' || true
            tail -30 /tmp/gradle-test.log | sed 's/^/::warning::/'
            exit 1
          fi
          echo "Unit tests OK"

      - name: Build full and lite release APKs
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon --stacktrace :app:assembleFullRelease :app:assembleLiteRelease > /tmp/gradle-apk.log 2>&1; then
            echo "::error::Gradle assemble failed"
            grep -E "error|e: |FAILURE|What went wrong|Could not|Unresolved" /tmp/gradle-apk.log | head -8 | sed 's/^/::error::/' || true
            tail -30 /tmp/gradle-apk.log | sed 's/^/::warning::/'
            exit 1
          fi
          echo "APK build OK"

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/full/release/*.apk release/jametulhoda-full.apk
          cp app/build/outputs/apk/lite/release/*.apk release/jametulhoda-lite.apk
          echo "== APK sizes =="
          stat -c '%n %s bytes' release/*.apk
          sha256sum release/*.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/jametulhoda-full.apk | sed -n '1,5p'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/jametulhoda-lite.apk | sed -n '1,5p'

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jametulhoda-apks
          path: |
            release/jametulhoda-full.apk
            release/jametulhoda-lite.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: jametulhoda Android APKs
          body: |
            APKهای رسمی جامعه‌الهدی (Full + Lite) — هر دو با امکانات کامل شامل ورود/ثبت‌نام و پسندیدن.

            - `jametulhoda-full.apk`: نسخهٔ کامل
            - `jametulhoda-lite.apk`: نسخهٔ سبک (کش و حافظهٔ کمتر، همان قابلیت‌ها)
          files: |
            release/jametulhoda-full.apk
            release/jametulhoda-lite.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics when build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jametulhoda-build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
